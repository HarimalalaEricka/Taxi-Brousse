<section th:fragment="content">
    <div class="header">
        <h2>Modifier Société</h2>
    </div>
    
    <div class="main">
        <form th:action="@{'/societe/edit/' + ${societe.idSociete}}" method="post">
            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" th:value="${societe.nom}" required>
            </div>
            
            <div class="form-group">
                <label for="adresse">Adresse :</label>
                <input type="text" id="adresse" name="adresse" th:value="${societe.adresse}">
            </div>
            
            <div class="form-group">
                <label for="contact">Contact :</label>
                <input type="text" id="contact" name="contact" th:value="${societe.contact}">
            </div>
            
            <div class="form-actions">
                <button type="submit">Enregistrer</button>
                <a href="/societe" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</section>
