
<section th:fragment="content">
    <div class="header">
        <h2>Nouveau Véhicule</h2>
    </div>

    <div class="main">
        <form th:action="@{/api/Vehicule/createVehicule}" method="post">
            <div class="form-group">
                <label for="immatriculation">Immatriculation :</label>
                <input type="text" id="immatriculation" name="immatriculation" required>
            </div>
            
            <div class="form-group">
                <label for="nombrePlaces">Nombre total de places :</label>
                <input type="number" id="nombrePlaces" name="nombrePlaces" min="1" required>
            </div>
            
            <h3 class="section-title">Places par Type</h3>
            
            <div th:each="type : ${types}" class="form-group">
                <label th:text="${type.type}"></label>
                <input type="number" 
                    th:name="'typePlace_' + ${type.idTypePlace}"
                    min="0" 
                    value="0">
            </div>
            
            <div class="form-actions">
                <button type="submit">Enregistrer</button>
                <a href="/api/Vehicule/list" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</section>
