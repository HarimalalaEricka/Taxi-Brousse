<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horaire de la Réservation</title>
</head>
<body>
    <h1>Horaires disponibles</h1>
    
    <!-- Vérifiez d'abord si la liste n'est pas vide -->
    <div th:if="${voyages != null and !voyages.empty}">
        <div class="info-box">
            <p>Nombre d'horaires disponibles: <span th:text="${voyages.size()}" style="font-weight: 700; color: #e74c3c;"></span></p>
        </div>
        
        <div class="voyage-list">
            <!-- Boucle Thymeleaf correcte -->
            <div class="voyage-item" th:each="voyage : ${voyages}">
                <div class="voyage-details">
                    <div class="time-date">
                        Heure: 
                        <span class="time" th:text="${voyage.heureDepart != null} ? 
                            ${#temporals.format(voyage.heureDepart, 'HH:mm')} : 'Non spécifié'"></span>
                        &nbsp;|&nbsp;
                        Date: 
                        <span class="date" th:text="${voyage.dateDepart != null} ? 
                            ${#temporals.format(voyage.dateDepart, 'dd/MM/yyyy')} : 'Non spécifié'"></span>
                    </div>
                    <a class="reserve-btn" th:href="@{/api/Reservation/list}">Réserver</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Message si pas de voyages -->
    <div th:if="${voyages == null or voyages.empty}">
        <div class="no-voyages">
            <p>Aucun horaire disponible.</p>
        </div>
    </div>
    
    <div class="action-links">
        <a class="link-btn" th:href="@{/api/Voyage/createVoyage}">Programmer un nouveau voyage</a>
        <a class="link-btn back-btn" th:href="@{/api/Reservation/reserver}">← Retour à la réservation</a>
    </div>
</body>
</html>
