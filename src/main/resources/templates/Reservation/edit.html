<section th:fragment="content">
    <div class="header">
        <h2>Modifier Réservation</h2>
    </div>
    
    <div class="main">
        <form th:action="@{'/api/Reservation/edit/' + ${reservation.idReservation}}" method="post">
            <div class="form-group">
                <label for="auNomDe">Nom pour la réservation :</label>
                <input type="text" id="auNomDe" name="auNomDe" th:value="${reservation.auNomDe}" required>
            </div>
            
            <div class="form-group">
                <label for="voyageId">Voyage :</label>
                <select id="voyageId" name="voyageId" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="voyage : ${voyages}" 
                            th:value="${voyage.idVoyage}"
                            th:selected="${reservation.voyage != null && reservation.voyage.idVoyage == voyage.idVoyage}"
                            th:text="${voyage.trajet.villeDepart} + ' → ' + ${voyage.trajet.villeArrivee} + ' - ' + ${voyage.dateDepart}">
                    </option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="utilisateurId">Utilisateur :</label>
                <select id="utilisateurId" name="utilisateurId" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="utilisateur : ${utilisateurs}" 
                            th:value="${utilisateur.idUtilisateur}"
                            th:selected="${reservation.utilisateur != null && reservation.utilisateur.idUtilisateur == utilisateur.idUtilisateur}"
                            th:text="${utilisateur.nom} + ' ' + ${utilisateur.prenom}">
                    </option>
                </select>
            </div>
            
            <div class="info-card" style="margin-top: 1.5rem;">
                <p><strong>Date de réservation :</strong> <span th:text="${#temporals.format(reservation.dateReservation, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p><strong>Statut :</strong> <span th:text="${reservation.statut}"></span></p>
            </div>
            
            <div class="form-actions">
                <button type="submit">Enregistrer</button>
                <a href="/api/Reservation/list" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</section>
