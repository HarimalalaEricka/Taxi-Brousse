<section th:fragment="content">
    <div class="header">
        <h2>Modifier Type de Prestation</h2>
    </div>
    
    <div class="main">
        <form th:action="@{'/type-prestation/edit/' + ${typePrestation.idTypePrestation}}" method="post">
            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" th:value="${typePrestation.nom}" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description :</label>
                <textarea id="description" name="description" rows="3" th:text="${typePrestation.description}"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit">Enregistrer</button>
                <a href="/type-prestation" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</section>
