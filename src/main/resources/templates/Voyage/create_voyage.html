<section th:fragment="content">
    <div class="header">
        <h2>Nouveau Voyage</h2>
    </div>
    
    <div class="main">
        <form th:action="@{/api/Voyage/createVoyage}" method="post">
            <h3 class="section-title">Date et Heure</h3>
            
            <div class="form-group">
                <label for="dateDepartStr">Date de départ :</label>
                <input type="date" id="dateDepartStr" name="dateDepartStr" required>
            </div>
            
            <div class="form-group">
                <label for="heureDepartStr">Heure de départ :</label>
                <input type="time" id="heureDepartStr" name="heureDepartStr" required>
            </div>
            
            <h3 class="section-title">Trajet</h3>
            
            <div class="form-group">
                <label for="idTrajet">Sélectionnez un trajet :</label>
                <select id="idTrajet" name="idTrajet" required>
                    <option value="" disabled selected>-- Choisissez un trajet --</option>
                    <option th:each="trajet : ${trajets}" 
                            th:value="${trajet.idTrajet}" 
                            th:text="${trajet.villeDepart} + ' → ' + ${trajet.villeArrivee}">
                    </option>
                </select>
            </div>
            
            <h3 class="section-title">Personnel et Véhicule</h3>
            
            <div class="form-group">
                <label for="idChauffeur">Chauffeur :</label>
                <select id="idChauffeur" name="idChauffeur" required>
                    <option value="" disabled selected>-- Sélectionnez un chauffeur --</option>
                    <option th:each="chauffeur : ${chauffeurs}" 
                            th:value="${chauffeur.idChauffeur}" 
                            th:text="${chauffeur.nom} + ' ' + ${chauffeur.prenom}">
                    </option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="idVehicule">Véhicule :</label>
                <select id="idVehicule" name="idVehicule" required>
                    <option value="" disabled selected>-- Choisissez un véhicule --</option>
                    <option th:each="vehicule : ${vehicules}" 
                            th:value="${vehicule.idVehicule}" 
                            th:text="${vehicule.immatriculation} + ' - ' + ${vehicule.nombrePlaces} + ' places'">
                    </option>
                </select>
            </div>
            
            <!-- Message d'erreur -->
            <div th:if="${error}" class="error-message">
                <span th:text="${error}"></span>
            </div>
            
            <div class="form-actions">
                <button type="submit">Créer le Voyage</button>
                <a href="/api/Voyage/list" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</section>
