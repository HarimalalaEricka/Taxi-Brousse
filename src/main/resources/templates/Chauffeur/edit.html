<section th:fragment="content">
    <div class="header">
        <h2>Modifier Chauffeur</h2>
    </div>
    
    <div class="main">
        <form th:action="@{'/api/Chauffeur/edit/' + ${chauffeur.idChauffeur}}" method="post">
            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" th:value="${chauffeur.nom}" required>
            </div>
            
            <div class="form-group">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" th:value="${chauffeur.prenom}" required>
            </div>
            
            <div class="form-group">
                <label for="telephone">Téléphone :</label>
                <input type="text" id="telephone" name="telephone" th:value="${chauffeur.telephone}" required>
            </div>
            
            <div class="form-actions">
                <button type="submit">Enregistrer</button>
                <a href="/api/Chauffeur/list" class="btn-cancel">Annuler</a>
            </div>
        </form>
    </div>
</section>
