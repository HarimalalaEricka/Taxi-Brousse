<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://fonts.googleapis.com/css?family=IM+FELL+French+Canon&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Imperial+Script&display=swap" rel="stylesheet" />
    <link th:href="@{/css/main.css}" rel="stylesheet" />
    <link th:if="${pageCss != null}" th:href="@{/css/{file}(file=${pageCss})}" rel="stylesheet">
    <title th:text="${title}">Taxi-Brousse</title>
</head>

<body>

<div class="v1_4">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Taxi-Brousse</span>
        </div>
        
        <nav class="sidebar-nav">
            <!-- Module Principal -->
            <div class="nav-group">
                <a href="/" class="nav-item">
                    <img src="/icons/typcn_home.svg" class="nav-icon" alt=""/>
                    <span>HOME</span>
                </a>
            </div>
            
            <!-- Module Transport -->
            <div class="nav-group">
                <div class="nav-group-title">TRANSPORT</div>
                <a href="/api/Reservation/list" class="nav-item">
                    <img src="/icons/Vector.svg" class="nav-icon" alt=""/>
                    <span>RESERVER</span>
                </a>
                <a href="/api/Voyage/list" class="nav-item">
                    <img src="/icons/healthicons_travel.svg" class="nav-icon" alt=""/>
                    <span>VOYAGE</span>
                </a>
                <a href="/api/Vehicule/list" class="nav-item">
                    <img src="/icons/zondicons_travel-bus.svg" class="nav-icon" alt=""/>
                    <span>VEHICULE</span>
                </a>
                <a href="/api/Trajet/list" class="nav-item">
                    <img src="/icons/streamline-ultimate_trip-road-bold.svg" class="nav-icon" alt=""/>
                    <span>TRAJET</span>
                </a>
                <a href="/api/Chauffeur/list" class="nav-item">
                    <img src="/icons/healthicons_truck-driver.svg" class="nav-icon" alt=""/>
                    <span>CHAUFFEUR</span>
                </a>
            </div>
            
            <!-- Module Facturation -->
            <div class="nav-group">
                <div class="nav-group-title">FACTURATION</div>
                <a href="/api/PrixBillet/list" class="nav-item">
                    <img src="/icons/tdesign_money-filled.svg" class="nav-icon" alt=""/>
                    <span>PRIX DE BILLET</span>
                </a>
                <a href="/api/CategoriePersonne/list" class="nav-item">
                    <img src="/icons/uil_bill.svg" class="nav-icon" alt=""/>
                    <span>CATÉGORIES</span>
                </a>
                <a href="/api/Facture/list" class="nav-item">
                    <img src="/icons/uil_bill.svg" class="nav-icon" alt=""/>
                    <span>FACTURE</span>
                </a>
            </div>
            
            <!-- Module Prestations -->
            <div class="nav-group">
                <div class="nav-group-title">PRESTATIONS</div>
                <a href="/prestation" class="nav-item">
                    <img src="/icons/uil_bill.svg" class="nav-icon" alt=""/>
                    <span>PRESTATIONS</span>
                </a>
                <a href="/prestation/historique" class="nav-item">
                    <img src="/icons/uil_bill.svg" class="nav-icon" alt=""/>
                    <span>PAIEMENT</span>
                </a>
                <a href="/societe" class="nav-item">
                    <img src="/icons/tdesign_money-filled.svg" class="nav-icon" alt=""/>
                    <span>SOCIETES</span>
                </a>
                <a href="/facture-societe" class="nav-item">
                    <img src="/icons/uil_bill.svg" class="nav-icon" alt=""/>
                    <span>FACTURE SOCIETE</span>
                </a>
                <a href="/type-prestation" class="nav-item">
                    <img src="/icons/uil_bill.svg" class="nav-icon" alt=""/>
                    <span>TYPES</span>
                </a>
                <a href="/tarif-prestation" class="nav-item">
                    <img src="/icons/tdesign_money-filled.svg" class="nav-icon" alt=""/>
                    <span>TARIFS</span>
                </a>
            </div>
        </nav>
    </div>
    
    <!-- CONTENU DYNAMIQUE -->
    <main th:replace="~{${content} :: ${fragment}}"></main>

    <div class="v4_8"></div>
    <span class="v4_12">Taxi-Brousse</span>

</div>

</body>
</html>
